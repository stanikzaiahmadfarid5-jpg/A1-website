<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A1 Deutsch</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f4f4;
        }
        header {
            background: #1e90ff;
            color: white;
            padding: 20px;
            text-align: center;
        }
        main {
            padding: 20px;
            max-width: 900px;
            margin: auto;
        }
        .card {
            background: white;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
    </style>
</head>

<body>

<header>
    <h1>A1 Deutsch</h1>
    <p>Deutsch lernen leicht gemacht</p>
</header>

<main>
    <div class="card">
        <h2>Haus Wörter</h2>
        <p>Tisch – der Tisch</p>
        <p>Stuhl – der Stuhl</p>
    </div>

    <div class="card">
        <h2>Supermarkt</h2>
        <p>Brot – das Brot</p>
        <p>Milch – die Milch</p>
    </div>
</main>

</body>
</html>
