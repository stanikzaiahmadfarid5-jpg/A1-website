<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Deutsch A1 Einfach</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f4f4;
    }

    /* Header */
    header {
      background: #2c7be5;
      color: white;
      padding: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 20px;
      font-weight: bold;
    }

    /* Hamburger button */
    .menu-btn {
      font-size: 26px;
      cursor: pointer;
      display: none;
    }

    /* Menu */
    nav {
      background: #1f5fbf;
      display: flex;
      justify-content: center;
    }

    nav a {
      color: white;
      padding: 15px;
      text-decoration: none;
      display: block;
    }

    nav a:hover {
      background: #174a99;
    }

    /* Mobile view */
    @media (max-width: 768px) {
      nav {
        display: none;
        flex-direction: column;
      }

      nav.show {
        display: flex;
      }

      .menu-btn {
        display: block;
      }
    }

    /* Content */
    .content {
      padding: 20px;
    }

    h1, h2 {
      color: #2c7be5;
    }

    ul {
      background: white;
      padding: 15px;
      border-radius: 8px;
    }

    li {
      margin-bottom: 8px;
      font-size: 16px;
    }
  </style>
</head>
<body>

<header>
  <div class="logo">Deutsch A1 Einfach</div>
  <div class="menu-btn" onclick="toggleMenu()">☰</div>
</header>

<nav id="menu">
  <a href="#">Start</a>
  <a href="#">Wörter</a>
  <a href="#">Grammatik</a>
  <a href="#">Texte</a>
  <a href="#">Über uns</a>
</nav>

<div class="content">
  <h1>Willkommen!</h1>
  <p>Einfach Deutsch lernen – Schritt für Schritt.</p>

  <h2>Wörter – Begrüßung</h2>
  <ul>
    <li><b>Guten Morgen</b> – صبح بخیر</li>
    <li><b>Guten Tag</b> – روز بخیر</li>
    <li><b>Guten Abend</b> – عصر بخیر</li>
    <li><b>Hallo</b> – سلام</li>
    <li><b>Tschüss</b> – خداحافظ</li>
  </ul>
</div>

<script>
  function toggleMenu() {
    document.getElementById("menu").classList.toggle("show");
  }
</script>

</body>
</html>
